<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LoveBird Social Feed</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background-color: #0f172a; color: #fff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 15px; }
    .header { width: 100%; max-width: 450px; display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #334155; margin-bottom: 15px; }
    .header h1 { color: #10b981; font-size: 24px; }
    .card { background-color: #1e293b; padding: 20px; border-radius: 12px; width: 100%; max-width: 450px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); margin-bottom: 15px; }
    textarea { width: 100%; padding: 10px; background-color: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 6px; outline: none; resize: none; height: 70px; margin-bottom: 10px; }
    button { width: 100%; padding: 10px; background-color: #10b981; border: none; color: #fff; font-weight: bold; border-radius: 6px; cursor: pointer; font-size: 15px; }
    button:hover { background-color: #059669; }
    
    /* Post Box Style */
    .post { background-color: #1e293b; border-radius: 12px; padding: 15px; width: 100%; max-width: 450px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
    .post-author { font-weight: bold; color: #10b981; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
    .post-author-img { width: 32px; height: 32px; background-color: #334155; border-radius: 50%; display: inline-block; }
    .post-content { margin-bottom: 12px; font-size: 15px; line-height: 1.4; color: #f1f5f9; }
    .post-actions { display: flex; justify-content: space-around; border-top: 1px solid #334155; border-bottom: 1px solid #334155; padding: 8px 0; margin-bottom: 10px; }
    .action-btn { background: none; border: none; color: #94a3b8; font-size: 14px; cursor: pointer; padding: 5px; }
    .action-btn:hover { color: #10b981; }
    
    /* Comment Section */
    .comments-container { margin-top: 8px; }
    .comment-input-box { display: flex; gap: 5px; margin-bottom: 8px; }
    .comment-input-box input { flex: 1; padding: 8px; background-color: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 6px; font-size: 13px; }
    .comment-input-box button { width: auto; padding: 8px 12px; font-size: 13px; }
    .single-comment { background-color: #0f172a; padding: 6px 10px; border-radius: 6px; font-size: 13px; margin-top: 5px; color: #cbd5e1; }
  </style>
</head>
<body>

  <!-- Top Navigation -->
  <div class="header">
    <h1>LoveBird</h1>
    <span>Feed</span>
  </div>

  <!-- Create Post Area -->
  <div class="card">
    <textarea id="post-text" placeholder="কী চিন্তা করছেন? লিখুন..."></textarea>
    <button onclick="createPost()">Post করুন</button>
  </div>

  <!-- Timeline Posts Section -->
  <div id="news-feed">
    <!-- Sample Post 1 -->
    <div class="post">
      <div class="post-author">
        <span class="post-author-img"></span>
        LoveBird User
      </div>
      <div class="post-content">স্বাগতম LoveBird অ্যাপে! এটি ফেসবুকের মতো একটি সোশ্যাল ফিড পেজ।</div>
      <div class="post-actions">
        <button class="action-btn" onclick="likePost(this)">❤️ <span class="like-count">0</span> Like</button>
        <button class="action-btn">💬 Comment</button>
      </div>
      <div class="comments-container">
        <div class="comment-input-box">
          <input type="text" placeholder="কমেন্ট লিখুন...">
          <button onclick="addComment(this)">Comment</button>
        </div>
        <div class="comment-list"></div>
      </div>
    </div>
  </div>

  <script>
    // Function to create a new post
    function createPost() {
      const text = document.getElementById('post-text').value.trim();
      if (!text) { alert("কিছু টাইপ করুন!"); return; }

      const feed = document.getElementById('news-feed');
      const newPost = document.createElement('div');
      newPost.className = 'post';
      newPost.innerHTML = `
        <div class="post-author">
          <span class="post-author-img"></span>
          আপনি ( You )
        </div>
        <div class="post-content">${text}</div>
        <div class="post-actions">
          <button class="action-btn" onclick="likePost(this)">❤️ <span class="like-count">0</span> Like</button>
          <button class="action-btn">💬 Comment</button>
        </div>
        <div class="comments-container">
          <div class="comment-input-box">
            <input type="text" placeholder="কমেন্ট লিখুন...">
            <button onclick="addComment(this)">Comment</button>
          </div>
          <div class="comment-list"></div>
        </div>
      `;

      feed.prepend(newPost);
      document.getElementById('post-text').value = '';
    }

    // Function to handle like button
    function likePost(btn) {
      const countSpan = btn.querySelector('.like-count');
      let currentLikes = parseInt(countSpan.innerText);
      countSpan.innerText = currentLikes + 1;
      btn.style.color = '#10b981';
    }

    // Function to handle comments
    function addComment(btn) {
      const input = btn.previousElementSibling;
      const text = input.value.trim();
      if (!text) return;

      const commentList = btn.parentElement.nextElementSibling;
      const newComment = document.createElement('div');
      newComment.className = 'single-comment';
      newComment.innerText = text;

      commentList.appendChild(newComment);
      input.value = '';
    }
  </script>
</body>
</html>
