<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LoveBird Social App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- নেভিগেশন বার -->
  <header class="navbar">
    <h1 class="logo">Love Bird</h1>
    <div class="user-info">
      <button id="logoutBtn">লগআউট</button>
    </div>
  </header>

  <!-- মেইন ফিড কন্টেইনার -->
  <main class="feed-container">
    
    <!-- পোস্ট লেখার বক্স -->
    <div class="create-post-card">
      <textarea id="postInput" placeholder="আপনার মনে কি আছে?"></textarea>
      <button id="postBtn">পোস্ট করুন</button>
    </div>

    <!-- পোস্টগুলো যেখানে জমা হয়ে দেখাবে -->
    <div id="postsFeed"></div>

  </main>

  <script src="script.js"></script>
</body>
</html>
